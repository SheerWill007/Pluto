upstream pluto_api {
    # Docker Compose service name; override for other environments
    server api:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 25m;  # a little above the API's MAX_UPLOAD_MB

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Google Identity Services needs accounts.google.com; fonts come from Google Fonts;
    # localhost:11434 allows the optional direct-to-Ollama mode; *.mux.com serves landing-deck
    # video (HLS manifests/segments via fetch, MSE blob: playback) and poster images.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.mux.com https://accounts.google.com/gsi/ https://oauth2.googleapis.com http://localhost:11434; frame-src https://accounts.google.com/gsi/; media-src 'self' blob: https://*.mux.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API (including Server-Sent Events) proxied to the backend -- same origin, no CORS
    location /api/ {
        proxy_pass http://pluto_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Stream tokens as they arrive instead of buffering the whole response
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Content-hashed build assets never change: cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA routing: unknown paths serve index.html, which must never be cached
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.mux.com https://accounts.google.com/gsi/ https://oauth2.googleapis.com http://localhost:11434; frame-src https://accounts.google.com/gsi/; media-src 'self' blob: https://*.mux.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com" always;
        try_files $uri $uri/ /index.html;
    }
}
