[project]
name = "pluto-agent"
version = "2.0.0"
description = "Pluto -- Multi-Agent AI System with RAG"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend", "chroma_db"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = [
    "E501",   # long prompt strings are clearer unwrapped
    "B008",   # FastAPI's Depends()/File() in defaults is idiomatic
    "S101",   # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"llm_provider/base_provider.py" = ["S113"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "api", "config", "core", "llm_provider", "memory", "rag", "schemas", "services", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["agents", "api", "config", "core", "memory", "rag", "schemas", "services", "tools"]
omit = ["tests/*"]
